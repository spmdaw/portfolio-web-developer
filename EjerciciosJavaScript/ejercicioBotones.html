<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EjercicioBotones</title>
</head>

<body>

    <button id="cambiarColor">Cambiar color</button>



    <script>

        let expregTelefono = /^([+(]?[0-9]{1,3}[)]?)?[0-9\s-]{9,16}$/;



        const boton = document.getElementById("cambiarColor");

        function generarColor() {
            let numeroAleatorio = Math.floor(Math.random() * 9999);
            let color = "#" + numeroAleatorio;

            return color;
        }

        boton.addEventListener("click", () => {

            document.body.style.backgroundColor = generarColor();

        });
    </script>

</body>

</html>
